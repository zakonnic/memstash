<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="779" height="509" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2328">Read throughput — 100% reads, Zipf keys</text>
  <text x="24" y="52" font-size="12" fill="#57606a">Million operations per second (higher is better) · AMD Ryzen 9 9900X, Go 1.26</text>

  <!-- gridlines (scale: 0.4252 px per Mops/s, x0 = 176) -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="304" y1="72" x2="304" y2="462"/>
    <line x1="431" y1="72" x2="431" y2="462"/>
    <line x1="559" y1="72" x2="559" y2="462"/>
    <line x1="686" y1="72" x2="686" y2="462"/>
  </g>
  <g font-size="10" fill="#8c959f" text-anchor="middle">
    <text x="304" y="478">300</text>
    <text x="431" y="478">600</text>
    <text x="559" y="478">900</text>
    <text x="686" y="478">1200</text>
  </g>

  <!-- bars -->
  <g font-size="12.5" fill="#1f2328">
    <!-- memstash-sieve 1237 -->
    <text x="168" y="92" text-anchor="end" font-weight="700">memstash-sieve</text>
    <rect x="176" y="72" width="526" height="30" rx="3" fill="#10b981"/>
    <text x="710" y="92" font-size="12" fill="#57606a" font-weight="700">1237</text>

    <!-- memstash-s3fifo 1227 -->
    <text x="168" y="132" text-anchor="end" font-weight="700">memstash-s3fifo</text>
    <rect x="176" y="112" width="522" height="30" rx="3" fill="#10b981"/>
    <text x="706" y="132" font-size="12" fill="#57606a" font-weight="700">1227</text>

    <!-- memstash-wtinylfu 1225 -->
    <text x="168" y="172" text-anchor="end" font-weight="700">memstash-wtinylfu</text>
    <rect x="176" y="152" width="521" height="30" rx="3" fill="#10b981"/>
    <text x="705" y="172" font-size="12" fill="#57606a" font-weight="700">1225</text>

    <!-- memstash-clock 1218 -->
    <text x="168" y="212" text-anchor="end" font-weight="700">memstash-clock</text>
    <rect x="176" y="192" width="518" height="30" rx="3" fill="#10b981"/>
    <text x="702" y="212" font-size="12" fill="#57606a" font-weight="700">1218</text>

    <!-- otter-wtinylfu 611 -->
    <text x="168" y="252" text-anchor="end">otter-wtinylfu</text>
    <rect x="176" y="232" width="260" height="30" rx="3" fill="#64748b"/>
    <text x="444" y="252" font-size="12" fill="#8c959f">611</text>

    <!-- sync.Map 562 (baseline) -->
    <text x="168" y="292" text-anchor="end" fill="#57606a">sync.Map*</text>
    <rect x="176" y="272" width="239" height="30" rx="3" fill="#cbd5e1"/>
    <text x="423" y="292" font-size="12" fill="#8c959f">562</text>

    <!-- theine-wtinylfu 284 -->
    <text x="168" y="332" text-anchor="end">theine-wtinylfu</text>
    <rect x="176" y="312" width="121" height="30" rx="3" fill="#64748b"/>
    <text x="305" y="332" font-size="12" fill="#8c959f">284</text>

    <!-- ristretto 161 -->
    <text x="168" y="372" text-anchor="end">ristretto</text>
    <rect x="176" y="352" width="68" height="30" rx="3" fill="#64748b"/>
    <text x="252" y="372" font-size="12" fill="#8c959f">161</text>

    <!-- bigcache 108 -->
    <text x="168" y="412" text-anchor="end">bigcache</text>
    <rect x="176" y="392" width="46" height="30" rx="3" fill="#64748b"/>
    <text x="230" y="412" font-size="12" fill="#8c959f">108</text>

    <!-- freecache 72 -->
    <text x="168" y="452" text-anchor="end">freecache</text>
    <rect x="176" y="432" width="31" height="30" rx="3" fill="#64748b"/>
    <text x="215" y="452" font-size="12" fill="#8c959f">72</text>
  </g>

  <text x="24" y="494" font-size="10.5" fill="#8c959f">* sync.Map performs no eviction — shown as a lower-bound baseline. hashicorp-lru (10 Mops/s) omitted for scale.</text>
</svg>
