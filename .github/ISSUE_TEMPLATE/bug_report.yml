name: Bug report
description: Something behaves differently from what the docs promise
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproducer
      description: >
        A self-contained Go snippet or test, ideally runnable. Include the cache configuration
        (capacity or budget, TTL, policy, shards, L2 adapter) - most behaviour depends on it.
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: memstash version
      placeholder: v0.9.3 (or a commit hash)
    validations:
      required: true

  - type: input
    id: goenv
    attributes:
      label: Go version and platform
      description: Output of `go version`.
      placeholder: go version go1.26.4 linux/amd64
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Race detector output, stack traces, or `Stats()` counters if you have them. For a performance
        report, please attach the benchmark and its `benchstat` comparison rather than a single timing.
