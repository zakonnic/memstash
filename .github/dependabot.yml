# Weekly dependency PRs. The adapters each pin a client SDK, so they are watched as separate modules.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      core:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /benchmarks
    schedule:
      interval: monthly
    groups:
      benchmarks:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /tests/integration
    schedule:
      interval: monthly
    groups:
      integration:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /l2/aerospike_adapter
    schedule:
      interval: weekly
    groups:
      aerospike:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /l2/badger_adapter
    schedule:
      interval: weekly
    groups:
      badger:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /l2/dynamo_adapter
    schedule:
      interval: weekly
    groups:
      dynamo:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /l2/gomemcache_adapter
