# Weekly dependency PRs. The adapters each pin a client SDK, so they are watched as separate modules.
# Every entry groups twice: `groups` alone only covers version updates, so security fixes would otherwise
# open one PR per advisory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      core:
        patterns: ['*']
      core-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /benchmarks
    schedule:
      interval: monthly
    groups:
      benchmarks:
        patterns: ['*']
      benchmarks-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /tests/integration
    schedule:
      interval: monthly
    groups:
      integration:
        patterns: ['*']
      integration-security:
        applies-to: security-updates
        patterns: ['*']

