name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported toolchain (go.mod) and the current one.
        go: ['1.24', '1.26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
        timeout-minutes: 20

  # The README badge. shields.io renders coverage.json from the badges branch, a single commit this job replaces on
  # every push to main; a pull request only gets the number in its job summary.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - name: coverage
        id: cover
        run: |
          make cover-gen
          pct=$(go tool cover -func=var/coverage.out | awk '/^total:/ {sub(/%/, "", $NF); print $NF}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Coverage: $pct%" >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 20
      - name: publish the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PCT: ${{ steps.cover.outputs.pct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=$(awk -v p="$PCT" 'BEGIN {
            print (p >= 90 ? "brightgreen" : p >= 80 ? "green" : p >= 70 ? "yellowgreen" : p >= 60 ? "yellow" : "red") }')
          dir=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" \
            > "$dir/coverage.json"
          cd "$dir"
          git init -q -b badges
          git add coverage.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "coverage $PCT%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # A 32-bit word: a string or an int64 takes two stores, and int overflows where a 64-bit build never gets near.
  # The runner executes 386 binaries natively. No -race: the race detector does not support 386.
  test-386:
    name: test (386)
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOARCH: '386'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - run: go vet ./...
      - run: go test -count=1 ./...
        timeout-minutes: 20

  # The only weakly ordered CPU in CI: item_other.go's seqlock pivots run on hardware nowhere else. The invariant
  # tests repeat in both builds, since -race swaps the meta stores for atomics.
  test-arm64:
    name: test (arm64)
    runs-on: ubuntu-24.04-arm
    env:
      GOWORK: off
      INVARIANTS: TestReclaimMatchesFreshTable|TestNoFalseMissUnderConcurrentChurn|TestIteratorConcurrentWritesNotTorn|TestGetConcurrentOverwriteNotTorn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - run: go test -race -count=1 ./...
        timeout-minutes: 20
      - run: go test -count=20 -run "$INVARIANTS" ./...
        timeout-minutes: 20
      - run: go test -race -count=5 -run "$INVARIANTS" ./...
        timeout-minutes: 20

  # Big-endian s390x and riscv64 under qemu user emulation. It checks behaviour, not memory ordering: emulated
  # loads and stores keep the host's order.
  test-qemu:
    name: test (${{ matrix.arch }}, qemu)
    runs-on: ubuntu-24.04
    env:
      GOWORK: off
      GOARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [s390x, riscv64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: go test -count=1 -timeout 35m -exec qemu-${{ matrix.arch }}-static ./...
        timeout-minutes: 40

  # Every other port only has to compile, tests included: vet type-checks the test files, where int-sized constants
  # live.
  cross-build:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - name: go vet per port
        run: |
          status=0
          for target in linux/arm linux/mips linux/mipsle linux/mips64le linux/loong64 linux/riscv64 linux/s390x \
            linux/ppc64le js/wasm wasip1/wasm darwin/arm64 windows/amd64 windows/arm64 freebsd/386; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || status=1
            echo "::endgroup::"
          done
          GOOS=linux GOARCH=arm GOARM=5 go vet ./... || status=1
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  adapters:
    name: adapter (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - aerospike_adapter
          - badger_adapter
          - dynamo_adapter
          - gomemcache_adapter
          - goredis_adapter
          - mc_adapter
          - mongo_adapter
          - pgx_adapter
          - rainycape_adapter
          - redigo_adapter
          - redispipe_adapter
          - rueidis_adapter
          - sql_adapter
          - tarantool_adapter
          - valkey_adapter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      # Each adapter is its own module, so a broken client SDK bump only shows up here. The workspace resolves the
      # core from this checkout, so these two catch a core change breaking an adapter.
      - name: build (core from this checkout)
        run: go -C l2/${{ matrix.adapter }} build ./...
      - name: vet (core from this checkout)
        run: go -C l2/${{ matrix.adapter }} vet ./...
      # Catches an adapter calling a core API newer than the version it requires: broken for consumers, green in-repo.
      # -mod=mod: a release commit may need the go.sum entry for a core tag pushed alongside it.
      - name: build (core from the version go.mod requires)
        run: go -C l2/${{ matrix.adapter }} build ./...
        env:
          GOWORK: off
          GOFLAGS: -mod=mod

  load-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      # The soak-test engine is its own module, so nothing else in CI compiles it.
      - run: go -C benchmarks/load_generator build ./...
      - run: go -C benchmarks/load_generator vet ./...
      - run: go -C benchmarks/load_generator test -race -count=1 ./...
        timeout-minutes: 10

  integration:
    runs-on: ubuntu-latest
    # The suite skips any backend that is not listening, so a service that fails to come up degrades to a skip.
    env:
      MEMSTASH_TEST_REDIS_ADDR: 127.0.0.1:43210
      MEMSTASH_TEST_REDIS_CLUSTER_ADDRS: 127.0.0.1:43211,127.0.0.1:43212,127.0.0.1:43213
      MEMSTASH_TEST_MEMCACHED_ADDR: 127.0.0.1:43214
      MEMSTASH_TEST_POSTGRES_ADDR: 127.0.0.1:43215
      MEMSTASH_TEST_MYSQL_ADDR: 127.0.0.1:43216
      MEMSTASH_TEST_MONGO_ADDR: 127.0.0.1:43217
      MEMSTASH_TEST_DYNAMO_ADDR: 127.0.0.1:43218
      MEMSTASH_TEST_AEROSPIKE_ADDR: 127.0.0.1:43219
      MEMSTASH_TEST_TARANTOOL_ADDR: 127.0.0.1:43220
      MEMSTASH_TEST_VALKEY_ADDR: 127.0.0.1:43221
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - name: start backing services
        run: make up
        timeout-minutes: 10
      - run: make test-integration
        timeout-minutes: 15
      - name: stop backing services
        if: always()
        run: make down

  vuln:
    runs-on: ubuntu-latest
    # In the workspace: the scan is about third-party dependency versions, which are the same either way, and the
    # benchmark and integration modules must resolve the tree rather than a published version of it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Adapters and the integration suite are separate modules with their own dependency trees, so a
      # root-only scan sees none of them. Keep going after a hit so one bad module doesn't hide the rest.
      - name: govulncheck (every module)
        run: |
          status=0
          for mod in $(git ls-files '*go.mod' | xargs -n1 dirname | sort -u); do
            echo "::group::$mod"
            govulncheck -C "$mod" ./... || status=1
            echo "::endgroup::"
          done
          exit $status
