# Backing services for the integration tests and benchmarks in tests/integration.
#
#   make up      # docker compose -f docker/docker-compose.yml [-f docker/docker-compose.override.yml] up -d
#   make integration-tests
#   make down
#
# The tests read the addresses from MEMSTASH_TEST_* environment variables (see tests/integration) and skip
# themselves when a server is not listening.
#
# Published ports live in the 43210-43221 block, not on the servers' default ports: those are usually already taken
# on a dev machine. Inside the containers the services keep their standard ports.
# To remap published ports, copy docker-compose.override.example.yml to docker-compose.override.yml (gitignored)
services:
  redis:
    image: redis:7-alpine
    # A single-node cache: LRU eviction, no persistence (no disk writes), keepalive on long-idle connections.
    # maxmemory counts only the dataset - the gap to mem_limit absorbs fragmentation and client output buffers.
    command:
      - redis-server
      - --maxmemory 7gb
      - --maxmemory-policy allkeys-lru
      - --save ''
      - --appendonly no
      - --tcp-keepalive 60
    mem_limit: 8g
    ports:
      - "43210:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # A 3-master Redis Cluster in one container, emulating a production cache cluster; /tmp is a tmpfs so
  # the cluster-config file and node logs never touch the disk. To remap, override REDIS_CLUSTER_PORTS.
  # The maxmemory below is per node: 3 x 2300mb = 6.9g of dataset under the same 8g ceiling the single node gets.
  redis-cluster:
    image: redis:7-alpine
    command: ["sh", "/redis-cluster/start.sh"]
    environment:
      REDIS_CLUSTER_PORTS: "43211 43212 43213"
      REDIS_CLUSTER_MAXMEMORY: "2300mb"
    volumes:
      - ./redis-cluster:/redis-cluster:ro
      # capped: a tmpfs defaults to half the VM's RAM.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 128m
    mem_limit: 8g
    ports:
      - "43211:43211"
      - "43212:43212"
      - "43213:43213"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDIS_CLUSTER_PORTS%% *} cluster info | grep -q cluster_state:ok"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --maxmemory 7gb
      - --maxmemory-policy allkeys-lru
      - --save ''
      - --appendonly no
      - --tcp-keepalive 60
    mem_limit: 8g
    ports:
      - "43221:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  memcached:
    image: memcached:1.6-alpine
    # -m bounds the slab storage only; connection buffers and the hash table live on top of it.
    command: ["memcached", "-m", "7168", "-c", "2048", "-t", "4"]
    mem_limit: 8g
    ports:
      - "43214:11211"
    # memcached has no built-in healthcheck command; the TCP port opening is the readiness signal.

  postgres:
    image: postgres:16-alpine
    # durability is traded away to spare the disk: no forced syncs, smaller WAL, synchronous_commit off.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=off
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: memstash
      POSTGRES_PASSWORD: memstash
      POSTGRES_DB: memstash
    mem_limit: 8g
    # parallel workers put their shared segments in /dev/shm, which docker defaults to 64m.
    shm_size: 1g
    ports:
      - "43215:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memstash"]
      interval: 2s
      timeout: 2s
      retries: 15

  mysql:
    image: mariadb:11
    # durability relaxed to spare the disk.
    command:
      - --innodb-buffer-pool-size=5G
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-doublewrite=0
      - --max-connections=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-log-file-size=1G
      - --innodb-io-capacity=2000
      - --innodb-io-capacity-max=4000
    environment:
      MARIADB_ROOT_PASSWORD: memstash
      MARIADB_USER: memstash
      MARIADB_PASSWORD: memstash
      MARIADB_DATABASE: memstash
    mem_limit: 8g
    ports:
      - "43216:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    command: ["mongod", "--wiredTigerCacheSizeGB", "2", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: memstash
      MONGO_INITDB_ROOT_PASSWORD: memstash
    # the ephemeral data dir lives on a tmpfs to keep it off the disk, so the files are charged to mem_limit too:
    # 4g of data plus the 2g cache leaves the container room to breathe. An uncapped tmpfs defaults to half the VM.
    volumes:
      - type: tmpfs
        target: /data/db
        tmpfs:
          size: 4g
    mem_limit: 8g
    ports:
      - "43217:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u memstash -p memstash --eval 'db.runCommand({ping: 1}).ok' | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local
    # -inMemory keeps the tables in the JVM heap, and the JVM would otherwise take a quarter of mem_limit for it.
    command: ["-Xmx6g", "-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    mem_limit: 8g
    ports:
      - "43218:8000"

  aerospike:
    image: aerospike/aerospike-server:latest
    # The image entrypoint renders its own template into /etc/aerospike/aerospike.conf, so the custom config is
    # mounted under a different name and passed to asd explicitly.
    command: ["asd", "--config-file", "/etc/aerospike/memstash.conf"]
    volumes:
      - ./aerospike/aerospike.conf:/etc/aerospike/memstash.conf:ro
    # data-size in the config bounds the records; the primary index (64 B each) is charged on top of it.
    mem_limit: 8g
    ports:
      - "43219:3000"
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v status | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 20

  tarantool:
    image: tarantool/tarantool:3
    command: ["tarantool", "/opt/tarantool/init.lua"]
    volumes:
      - ./tarantool/init.lua:/opt/tarantool/init.lua:ro
    mem_limit: 8g
    ports:
      - "43220:3301"
    healthcheck:
      test: ["CMD-SHELL", "tarantool -e \"os.exit(require('net.box').connect('localhost:3301'):ping() and 0 or 1)\""]
      interval: 3s
      timeout: 3s
      retries: 20
